events {
    worker_connections 1024;
}

http {
    # Группа балансировки для главного сервиса
    upstream task_backend {
        server task-api:8080;
    }

    server {
        listen 80;

        # Главная страница и задачи идут через балансировщик в task-api
        location / {
            proxy_pass http://task_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Маршрутизация как в API Gateway для аналитики
        location /analytics {
            proxy_pass http://analytics-service:8081/analytics;
        }

        # Маршрутизация для уведомлений
        location /notifications {
            proxy_pass http://notification-service:8082/notifications;
        }
    }
}
