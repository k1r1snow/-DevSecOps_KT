spring.application.name=task-api
server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/app}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
services.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8082}
services.analytics.url=${ANALYTICS_SERVICE_URL:http://localhost:8081}

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
