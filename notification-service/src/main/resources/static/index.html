<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><title>Notification Service (8082)</title>
    <style>

<body>
<div class="card">

    <a href="http://localhost:8080/">&#11013; &#1053;&#1072; &#1075;&#1083;&#1072;&#1074;&#1085;&#1091;&#1102; (8080)</a>
</div>
<script>
    async function load() {
        const data = await (await fetch('/notifications')).json();

        ul.innerHTML = data.length ? '' : '<li>&#1059;&#1074;&#1077;&#1076;&#1086;&#1084;&#1083;&#1077;&#1085;&#1080;&#1081; &#1087;&#1086;&#1082;&#1072; &#1085;&#1077;&#1090;</li>';

    }
    load();
</script>
</body>
